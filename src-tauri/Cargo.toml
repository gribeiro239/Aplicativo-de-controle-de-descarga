[package]
name = "app-descarga"
version = "0.5.6"
description = "Aplicativo de análise de descargas"
authors = ["APP Descarga"]
edition = "2021"

[lib]
name = "app_descarga_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
